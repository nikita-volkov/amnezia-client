name: 'Deploy workflow'

on:
  push:
    branches:
      - '**'
  workflow_dispatch:

env:
  QT_MIRROR: https://mirrors.ocf.berkeley.edu/qt/ # https://download.qt.io/static/mirrorlist/

jobs:
  Build-MacOS-BigSur:
    runs-on: macos-15

    env:
      # Qt 6.7.x is the last release whose macOS prebuilt libraries run on macOS 11 (Big Sur).
      # Qt 6.8+ requires macOS 12+. The app deployment target is set in cmake/platform_settings.cmake.
      QT_VERSION: 6.7.3

      PROD_AGW_PUBLIC_KEY: ${{ secrets.PROD_AGW_PUBLIC_KEY }}
      PROD_S3_ENDPOINT: ${{ secrets.PROD_S3_ENDPOINT }}
      FALLBACK_S3_ENDPOINT: ${{ secrets.FALLBACK_S3_ENDPOINT }}
      DEV_AGW_PUBLIC_KEY: ${{ secrets.DEV_AGW_PUBLIC_KEY }}
      DEV_AGW_ENDPOINT: ${{ secrets.DEV_AGW_ENDPOINT }}
      DEV_S3_ENDPOINT: ${{ secrets.DEV_S3_ENDPOINT }}
      FREE_V2_ENDPOINT: ${{ secrets.FREE_V2_ENDPOINT }}
      PREM_V1_ENDPOINT: ${{ secrets.PREM_V1_ENDPOINT }}

    steps:
    - name: 'Get sources'
      uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 10

    - name: 'Setup xcode'
      uses: maxim-lobanov/setup-xcode@v1
      with:
        xcode-version: '16.4'

    - name: 'Install Qt'
      uses: jurplel/install-qt-action@v4.3.1
      with:
        version: ${{ env.QT_VERSION }}
        host: 'mac'
        target: 'desktop'
        arch: 'clang_64'
        modules: 'qtremoteobjects qt5compat qtshadertools'
        dir: ${{ runner.temp }}
        setup-python: 'true'
        set-env: 'true'
        aqtversion: '==3.3.0'
        py7zrversion: '==0.22.*'
        extra: '--base ${{ env.QT_MIRROR }}'

    - name: 'Setup python'
      uses: actions/setup-python@v6
      with:
        python-version: 3.14

    - name: 'Install conan'
      run: pip install "conan==2.28.0"

    - name: 'Build project'
      env:
        QT_INSTALL_DIR: ${{ runner.temp }}
        AMNEZIA_BUILD_TESTS: ON
      shell: bash
      run: deploy/build.sh --generator Ninja --installer all

    - name: 'Upload macOS test build'
      uses: actions/upload-artifact@v7
      with:
        name: macos-build
        path: deploy/build/client/tests
        retention-days: 7

    - name: 'Upload installer artifact'
      uses: actions/upload-artifact@v7
      with:
        path: deploy/build/AmneziaVPN_*_macos_x64.pkg
        archive: false
        retention-days: 7

# ------------------------------------------------------

  test-macos-big-sur:
    name: Test macOS Big Sur (${{ matrix.filter }})
    needs: Build-MacOS-BigSur

    strategy:
      fail-fast: false
      matrix:
        filter:
          - MultipleImportsTest
          - ServerEditTest
          - DefaultServerChangeTest
          - ServerEdgeCasesTest
          - SignalOrderTest
          - ServersModelSyncTest
          - ServerRenameTest
          - SettingsSignalsTest
          - UiServersModelAndControllerTest
          - XraySerializationTest
          - UiLanguageModelAndControllerTest
          - UiIpModelAndControllerTest
          - UiAppSTModelAndControllerTest
          - UiAllowedDnsModelAndControllerTest
          - ConnectionTest
          - OpenSSLLibraryTest
          # BackupExportImportTest is excluded: it hard-fails without the
          # BACKUP_FILE_BASE64 secret, which is not configured in this fork.

    runs-on: macos-15

    env:
      QT_VERSION: 6.7.3
      QTEST_FUNCTION_TIMEOUT: 7200000
      THIRD_PARTY_AWG_VPN_KEY: ${{ secrets.THIRD_PARTY_AWG_VPN_KEY }}
      THIRD_PARTY_WIRE_GUARD_VPN_KEY: ${{ secrets.THIRD_PARTY_WIRE_GUARD_VPN_KEY }}
      THIRD_PARTY_XRAY_VPN_KEY: ${{ secrets.THIRD_PARTY_XRAY_VPN_KEY }}
      THIRD_PARTY_OPEN_VPN_KEY: ${{ secrets.THIRD_PARTY_OPEN_VPN_KEY }}
      THIRD_PARTY_CLOAK_VPN_KEY: ${{ secrets.THIRD_PARTY_CLOAK_VPN_KEY }}
      THIRD_PARTY_SS_VPN_KEY: ${{ secrets.THIRD_PARTY_SS_VPN_KEY }}
      THIRD_PARTY_IKEV_VPN_KEY: ${{ secrets.THIRD_PARTY_IKEV_VPN_KEY }}
      THIRD_PARTY_PREMIUM_VPN_KEY: ${{ secrets.THIRD_PARTY_PREMIUM_VPN_KEY }}
      THIRD_PARTY_VMESS_NEW_IMPORT_DATA: ${{ secrets.THIRD_PARTY_VMESS_NEW_IMPORT_DATA }}
      THIRD_PARTY_VMESS_IMPORT_DATA: ${{ secrets.THIRD_PARTY_VMESS_IMPORT_DATA }}
      THIRD_PARTY_TROJAN_IMPORT_DATA: ${{ secrets.THIRD_PARTY_TROJAN_IMPORT_DATA }}
      THIRD_PARTY_VLESS_IMPORT_DATA: ${{ secrets.THIRD_PARTY_VLESS_IMPORT_DATA }}
      THIRD_PARTY_SHADOWSOCKS_IMPORT_DATA: ${{ secrets.THIRD_PARTY_SHADOWSOCKS_IMPORT_DATA }}
      THIRD_PARTY_SHADOWSOCKS_SUBSCRIPTION_IMPORT_DATA: ${{ secrets.THIRD_PARTY_SHADOWSOCKS_SUBSCRIPTION_IMPORT_DATA }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: 'true'
          fetch-depth: 10

      - name: Download build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: deploy/build/client/tests

      - name: Install Qt
        uses: jurplel/install-qt-action@v4.3.1
        with:
          version: ${{ env.QT_VERSION }}
          host: mac
          target: desktop
          arch: clang_64
          modules: qtremoteobjects qt5compat qtshadertools
          dir: ${{ runner.temp }}
          set-env: true

      - name: Restore executable permissions
        run: |
          find deploy/build/client/tests \
            -type f \
            -name "test_*" \
            -exec chmod +x {} \;

      - name: Run tests
        shell: bash
        run: |
          QT_ROOT="$RUNNER_TEMP/Qt/$QT_VERSION/macos"

          export DYLD_LIBRARY_PATH="$PWD/deploy/build/client/tests:$QT_ROOT/lib:${DYLD_LIBRARY_PATH:-}"

          ctest --test-dir deploy/build/client/tests -R "${{ matrix.filter }}" --output-on-failure
